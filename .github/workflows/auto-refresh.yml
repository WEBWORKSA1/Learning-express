name: Auto-refresh content

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "data/sources.json"
      - "data/contests.json"

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest videos and education news
        run: python3 scripts/update_feeds.py
      - name: Rebuild static pages
        run: python3 build/build.py
      - name: Commit and push if changed
        run: |
          git config user.name "learning-express-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-refresh: videos, news and pages ($(date -u +%Y-%m-%d))"
            git push
          fi
      - name: Request GitHub Pages rebuild
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /dev/null -w "Pages build request: %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
